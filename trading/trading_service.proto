syntax = "proto3";

package trading;

import "google/protobuf/timestamp.proto";
import "trading/trading_models.proto";
import "trading/trading_types.proto";

service TradingService {
  // Keep for backend/native clients.
  rpc StreamEvents(stream StreamEventsRequest) returns (stream TradingEvent);

  // Add for browser clients.
  rpc SubscribeEvents(Subscribe) returns (stream TradingEvent);
}

message StreamEventsRequest {
  oneof msg {
    Subscribe subscribe = 1;
    Unsubscribe unsubscribe = 2;
  }
}

message Error {
  string message = 1;
}

message Heartbeat {
  google.protobuf.Timestamp sent_at = 1;
}

// Subscribe and Unsubscribe confirmation
message Subscribe {
  string trading_account_id = 1;
  repeated EventType subscriptions = 2;

  // Narrows the per-instrument subjects to one instrument.
  //
  // The state stream keys a position at
  // `...account.<account>.instrument.<class>.<key>.position` and an order at
  // the same prefix plus `order.<order_id>`, so these two fields are the
  // coordinates of that subject and nothing more. A subscriber that names them
  // is handed one instrument's state instead of the whole account's.
  //
  // Deliberately the subject's own coordinates rather than an instrument
  // message. Instrument identity lives in `rust_types` and is kept out of the
  // wire on purpose: putting it here would mean threading it through every
  // model and a database migration besides. Two strings that address a subject
  // are not that.
  //
  // Both empty is the whole account, which is what every client sent before
  // these existed and what they still mean by sending nothing.
  //
  // Trade, error and latency are account-scoped subjects with no instrument
  // segment, so they are unaffected by these and continue to arrive for the
  // whole account. A subscriber that wants one instrument's fills filters them
  // itself.
  //
  // The venue's own spelling of the symbol, made subject-safe. Required for an
  // instrument-scoped subscription: a class on its own addresses nothing.
  string instrument_key = 3;

  // The asset class the key belongs to, lower-case, as it appears in the
  // subject.
  //
  // Optional, and empty means any class. That is not laziness: a resolver has
  // to have filled the instrument for the class to be known, and until they all
  // do, the same symbol reaches the stream under `equity` from one publisher
  // and `unspecified` from another. Pinning a class while that is true is a
  // subscription that silently matches nothing, and silence is indistinguishable
  // from a flat account. Name it once the resolvers make it reliable.
  string instrument_class = 4;
}

message Unsubscribe {
  string trading_account_id = 1;
}

message Status {
  string message = 1;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_BROKER_ORDER = 1;
  EVENT_TYPE_BROKER_POSITION = 2;
  EVENT_TYPE_BROKER_TRADE = 3;

  // Commands the platform has committed, before the broker has answered them.
  //
  // The other three are the broker's account of what happened. This one is the
  // platform's account of what it was asked to do, and it is the only kind here
  // that is delivered whether or not a broker connection exists.
  EVENT_TYPE_INTENT_ACTION = 4;
}

message TradingEvent {
  oneof event {
    Heartbeat heartbeat = 1;
    Error error = 2;
    Status status = 3;
    BrokerOrder broker_order = 4;
    BrokerPosition broker_position = 5;
    BrokerTrade broker_trade = 6;
    IntentAction intent_action = 7;
  }
}
