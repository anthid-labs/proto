syntax = "proto3";

package trading;

// Broker integrations supported by Anthid.
enum Broker {
  BROKER_UNSPECIFIED = 0; // Unspecified broker
  BROKER_LIGHTSPEED_CONNECT = 1;      // Lightspeed Connect
  BROKER_ALPACA = 2;                  // Alpaca
}

// Defines how an order should be executed.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;     // Unspecified
  ORDER_TYPE_LIMIT = 1;           // Limit order
  ORDER_TYPE_MARKET = 2;          // Market order
  ORDER_TYPE_FILL_OR_KILL = 3;    // Fill or Kill (FOK)
  ORDER_TYPE_LIMIT_ON_OPEN = 4;   // Limit On Open (LOO)
  ORDER_TYPE_LIMIT_ON_CLOSE = 5;  // Limit On Close (LOC)
  ORDER_TYPE_MARKET_ON_OPEN = 6;  // Market On Open (MOO)
  ORDER_TYPE_MARKET_ON_CLOSE = 7; // Market On Close (MOC)
  ORDER_TYPE_STOP = 8;            // Stop order
  ORDER_TYPE_STOP_LIMIT = 9;      // Stop Limit order
  ORDER_TYPE_TRAILING_STOP = 10;  // Trailing Stop order
}

// Defines how long an order remains active.
enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;         // Unspecified
  TIME_IN_FORCE_DAY = 1;                 // Day
  TIME_IN_FORCE_GOOD_TILL_CANCEL = 2;    // Good Till Cancel (GTC)
  TIME_IN_FORCE_AT_OPEN = 3;             // At Open (OPG)
  TIME_IN_FORCE_IMMEDIATE_OR_CANCEL = 4; // Immediate Or Cancel (IOC)
  TIME_IN_FORCE_FILL_OR_KILL = 5;        // Fill Or Kill (FOK)
  TIME_IN_FORCE_EXT = 6;                 // Extended Hours
  TIME_IN_FORCE_AT_CLOSE = 7;            // At Close
}

// Side of an order.
enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0; // Unspecified
  ORDER_SIDE_BUY = 1;         // Buy
  ORDER_SIDE_SELL = 2;        // Sell
  ORDER_SIDE_SELL_SHORT = 3;  // Sell Short
}

// Where an order is commanded to go.
//
// Deliberately not the same question as an instrument's venue, which says where
// the instrument is *listed*. AAPL is listed on one exchange and routable to
// several: the listing is a fact about the security that the instruments
// catalogue owns, and this is an instruction the caller gives per order. Two
// orders on the same instrument from the same account can carry different
// values here, which is why this is a field of the order and not of the
// instrument.
//
// Only equities give the choice any width. Every other asset class trades at
// exactly one venue - ESZ5 means nothing away from CME - so for those the
// instrument already determines the destination and ORDER_VENUE_SMART is the
// honest answer: there is nothing to choose between.
//
// This was RouteStrategy, which named the mechanism rather than the thing and
// read as though the platform routed every asset class this way.
enum OrderVenue {
  ORDER_VENUE_UNSPECIFIED = 0; // Unspecified
  ORDER_VENUE_SMART = 1;       // Hand the destination to the broker's router
  ORDER_VENUE_AMEX = 2;        // American Stock Exchange (AMEX)
  ORDER_VENUE_ARCA = 3;        // NYSE Arca
  ORDER_VENUE_BATS = 4;        // BATS Global Markets
  ORDER_VENUE_BATY = 5;        // BATS Y-Exchange
  ORDER_VENUE_EDGA = 6;        // EDGA Exchange
  ORDER_VENUE_EDGX = 7;        // EDGX Exchange
  ORDER_VENUE_NSDQ = 8;        // NASDAQ Stock Market
  ORDER_VENUE_NYSE = 9;        // New York Stock Exchange
}

// Detailed execution status of an order.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;      // Unspecified
  ORDER_STATUS_PENDING_NEW = 1;      // Accepted and awaiting acknowledgment
  ORDER_STATUS_NEW = 2;              // Active and working
  ORDER_STATUS_PARTIALLY_FILLED = 3; // Partially executed
  ORDER_STATUS_FILLED = 4;           // Fully executed
  ORDER_STATUS_PENDING_CANCEL = 5;   // Cancel request submitted
  ORDER_STATUS_CANCELLED = 6;        // Successfully cancelled
  ORDER_STATUS_PENDING_REPLACE = 7;  // Replace request submitted
  ORDER_STATUS_REPLACED = 8;         // Successfully replaced
  ORDER_STATUS_STOPPED = 9;          // Stopped by broker or exchange
  ORDER_STATUS_REJECTED = 10;        // Rejected by broker or exchange
}

// High-level lifecycle state derived from OrderStatus.
enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0; // Unspecified
  ORDER_STATE_OPEN = 1;        // Active or pending
  ORDER_STATE_CLOSED = 2;      // Reached a terminal state
  ORDER_STATE_REJECTED = 3;    // Rejected before becoming active
}

// What kind of instruction one command of an intent carries.
//
// An intent is a chain of these: a create, then any replaces or cancels made
// against it. The chain is ordered by the command's `seq`, not by this.
enum IntentActionType {
  INTENT_ACTION_TYPE_UNSPECIFIED = 0; // Unspecified
  INTENT_ACTION_TYPE_CREATE = 1;      // Open the intent
  INTENT_ACTION_TYPE_REPLACE = 2;     // Amend the working order
  INTENT_ACTION_TYPE_CANCEL = 3;      // Withdraw the working order
}

// Class of credential behind an instruction.
//
// An order placed with an organization's API key, one placed by a person signed
// in to the dashboard, and one placed by an Anthid service acting on the
// organization's behalf are three different claims once an order is disputed,
// and a subscriber watching its own account has a legitimate reason to tell
// them apart.
//
// The class only. Which key, which person, and from what address are recorded
// on the platform's own copy of the command and are not published to
// subscribers; see IntentAction.
enum IntentPrincipalType {
  INTENT_PRINCIPAL_TYPE_UNSPECIFIED = 0; // Unspecified
  INTENT_PRINCIPAL_TYPE_API_KEY = 1;     // An organization's API key
  INTENT_PRINCIPAL_TYPE_USER = 2;        // A signed-in person
  INTENT_PRINCIPAL_TYPE_SERVICE = 3;     // An Anthid service acting on the org's behalf
}
